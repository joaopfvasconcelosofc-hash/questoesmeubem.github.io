      { text: "Ativação de linfócitos T citotóxicos", correct: false, explain: "Não é o mecanismo agudo da anafilaxia." },
      { text: "Inibição da histamina", correct: false, explain: "Ocorre o oposto: liberação excessiva." }
    ]
  },

  {
    q: "32) Paciente de 35 anos chega ao pronto-socorro com urticária, edema facial e sensação de desmaio após ingestão de castanhas. PA: 70/40 mmHg. Após uso de adrenalina IM, deve-se administrar:",
    choices: [
      { text: "Ressuscitação volêmica com SF 0,9%, 30 mL/kg na 1ª hora", correct: true, explain: "Conduta indicada para choque anafilático conforme o PDF." },
      { text: "Corticosteroide oral imediato", correct: false, explain: "Usado após estabilização." },
      { text: "Antibiótico profilático", correct: false, explain: "Não há infecção associada." },
      { text: "Sedativo EV", correct: false, explain: "Contraindicado." }
    ]
  },

  {
    q: "33) Homem de 29 anos apresenta anafilaxia bifásica após exposição a amendoim. O primeiro episódio foi controlado, mas oito horas depois recidiva. O uso de qual fármaco poderia ter ajudado a prevenir essa recorrência?",
    choices: [
      { text: "Corticosteroide", correct: true, explain: "O PDF destaca que o uso empírico visa prevenir reações bifásicas." },
      { text: "Anti-histamínico", correct: false, explain: "Reduz sintomas cutâneos, mas não previne bifásica." },
      { text: "Broncodilatador", correct: false, explain: "Atua apenas em broncoespasmo." },
      { text: "Azul de metileno", correct: false, explain: "Utilizado em choque refratário, não na prevenção de recorrência." }
    ]
  },

  {
    q: "34) Mulher de 23 anos chega com urticária e hipotensão após aplicação de penicilina. Após estabilização, quais medidas são adequadas na alta?",
    choices: [
      { text: "Prescrever prednisona VO por 3–5 dias e encaminhar ao alergologista", correct: true, explain: "São recomendações do PDF para alta e prevenção de novos episódios." },
      { text: "Alta imediata sem prescrição", correct: false, explain: "Deve haver observação e tratamento preventivo." },
      { text: "Reintroduzir penicilina para dessensibilização", correct: false, explain: "Contraindicado neste momento." },
      { text: "Uso de antibiótico profilático", correct: false, explain: "Sem relação com a anafilaxia." }
    ]
  },

  {
    q: "35) Um paciente apresenta anafilaxia após infusão de gamaglobulina. Qual o mecanismo imunológico envolvido nesse tipo de reação?",
    choices: [
      { text: "Formação de imunocomplexos", correct: true, explain: "O PDF cita esse mecanismo específico para gamaglobulina." },
      { text: "Ativação de complemento direto", correct: false, explain: "Esse é o mecanismo dos contrastes iodados." },
      { text: "Degranulação inespecífica de mastócitos", correct: false, explain: "Ocorre com opióides e relaxantes musculares." },
      { text: "Ativação de receptores nicotínicos", correct: false, explain: "Sem relação com o processo." }

];



function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}

const quizEl=document.getElementById('quiz');
let state={answered:0,correct:0};

function render(){
  quizEl.innerHTML='';
  questions.forEach((item,idx)=>{
    const choices=shuffle(item.choices.map((c,i)=>({...c,id:`q${idx}_c${i}`})));
    const wrap=document.createElement('section');
    wrap.className='card';wrap.dataset.qindex=idx;
    wrap.innerHTML=`<div class="qhead"><div class="qnum">Questão ${idx+1}</div></div>
    <div class="question">${item.q}</div>
    <div class="options" id="opts-${idx}"></div>
    <div class="explain" id="exp-${idx}"></div>`;
    const optsEl=wrap.querySelector(`#opts-${idx}`);
    choices.forEach(c=>{
      const lab=document.createElement('label');lab.className='option';
      lab.innerHTML=`<input type="radio" name="q${idx}" data-correct="${c.correct}" data-explain="${c.explain}"><div>${c.text}</div>`;
      optsEl.appendChild(lab);
      lab.querySelector('input').addEventListener('change',(e)=>handleAnswer(idx,e.target));
    });
    quizEl.appendChild(wrap);
  });
  updateStatus();
}

function handleAnswer(idx,inputEl){
  const exp=document.getElementById(`exp-${idx}`);
  const correct=inputEl.dataset.correct==='true';
  const explain=inputEl.dataset.explain;
  exp.style.display='block';
  exp.innerHTML=(correct?'✅ <b>Correto.</b> ':'❌ <b>Incorreto.</b> ')+explain;
  exp.classList.toggle('ok',correct);
  exp.classList.toggle('err',!correct);
  updateProgress();
}

function updateProgress(){
  let a=0,c=0;
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);let any=false,corr=false;
    for(const r of radios){if(r.checked){any=true;if(r.dataset.correct==='true')corr=true;break;}}
    if(any)a++;if(corr)c++;
  });
  state.answered=a;state.correct=c;updateStatus();
}

function updateStatus(){
  document.getElementById('answeredCount').textContent=`Respondidas: ${state.answered} / ${questions.length}`;
  document.getElementById('progressCorrect').textContent=`Corretas: ${state.correct}`;
}

document.getElementById('showAll').addEventListener('click',()=>{
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);
    const exp=document.getElementById(`exp-${idx}`);let any=false;
    for(const r of radios){
      if(r.checked){any=true;const corr=r.dataset.correct==='true';
        exp.style.display='block';
        exp.innerHTML=(corr?'✅ <b>Correto.</b> ':'❌ <b>Incorreto.</b> ')+r.dataset.explain;
        exp.classList.toggle('ok',corr);exp.classList.toggle('err',!corr);
        break;}
    }
    if(!any){exp.style.display='block';exp.innerHTML='<em>Nenhuma alternativa selecionada.</em>';exp.classList.remove('ok','err');}
  });
  updateProgress();
});

document.getElementById('reset').addEventListener('click',()=>{
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);
    for(const r of radios)r.checked=false;
    const exp=document.getElementById(`exp-${idx}`);
    exp.style.display='none';exp.innerHTML='';exp.classList.remove('ok','err');
  });
  state={answered:0,correct:0};updateStatus();
});

render();
</script>
