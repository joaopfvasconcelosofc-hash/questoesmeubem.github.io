<title>Quiz — Intoicações exógenas</title>
<style>
  :root{

    --glass: rgba(255,255,255,0.03);
  }
  body{font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial; background:linear-gradient(180deg,#071020,#081426); color:#e6eef8; margin:0; padding:24px;}
  header{display:flex; gap:16px; align-items:center; margin-bottom:18px;}
  h1{font-size:20px; margin:0;}
  p.lead{margin:0; color:var(--muted); font-size:14px;}
  .container{display:grid; gap:12px; max-width:980px; margin:0 auto;}
  .card{background:var(--card); border-radius:12px; padding:14px; box-shadow:0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03);}
  .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .qnum{font-weight:600; color:var(--accent);}
  .question{font-size:16px; margin-bottom:8px;}
  .options{display:flex; flex-direction:column; gap:8px;}
  label.option{background:var(--glass); padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:10px; border:1px solid transparent;}

  label.option:hover{border-color:rgba(157,78,221,0.2);}
  .explain{margin-top:10px; padding:10px; border-radius:8px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04)); color:#f3e8ff; display:none; border-left:4px solid var(--accent);}

  .explain.err{border-left-color:var(--err);}
  .meta{font-size:13px; color:var(--muted); margin-top:6px;}
  footer{max-width:980px; margin:20px auto 60px; color:var(--muted); font-size:13px; text-align:center;}
  button{background:var(--accent); color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;}
  button.ghost{background:transparent; border:1px solid rgba(255,255,255,0.06);}
  .scorecard{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,0.04); padding:6px 10px; border-radius:999px; color:var(--muted); font-weight:600;}
</style>
</head>
<body>
<header>
  <div>
    <h1>Quiz Interativo — Intoxicações exógenas</h1>
    <p class="lead">30 questões - Intoxicações exógenas</p>
  </div>
  <div style="margin-left:auto;">
    <div class="scorecard">

<footer class="card">

      <button id="showAll">Mostrar explicações</button>
      <button class="ghost" id="reset">Reiniciar quiz</button>
    </div>
  </div>
</footer>

<script>

const questions = [
  {
    q: "1) Questão — Na avaliação inicial de um paciente com suspeita de intoxicação exógena, qual é a melhor sequência de prioridades na abordagem imediata?",
    choices: [
      { text: "História detalhada → Exame físico completo da cabeça aos pés → Notificar CEATOX.", correct: false, explain: "Embora história e identificação do tóxico sejam importantes, a prioridade na emergência é estabilizar o paciente seguindo ABCDE (vias aéreas, respiração, circulação, déficit neurológico e exposição) antes de aprofundar a anamnese e notificar o serviço toxicológico." },
      { text: "ABCDE → medidas de descontaminação adequadas → solicitação de exames complementares e notificação ao serviço toxicológico.", correct: true, explain: "A sequência correta é estabilizar (ABCDE), avaliar a necessidade de descontaminação ou antídoto, requisitar exames e contatar suporte toxicológico para orientação específica." },
      { text: "Lavagem gástrica em todos os casos → carvão ativado → observação em ambulatório.", correct: false, explain: "Lavagem e carvão não são indicados indiscriminadamente; dependem de via, tempo decorrido, agente e risco de broncoaspiração. Procedimentos invasivos sem indicação podem causar danos." },
      { text: "Administração empírica de antídoto padrão (naloxone + atropina) → exames laboratoriais.", correct: false, explain: "Antídotos devem ser direcionados conforme a síndrome clínica suspeita. Administrar antídotos empíricos sem justificativa pode piorar o quadro; estabilização é prioritária." }
    ]
  },
  {
    q: "2) Questão — Em relação às medidas de descontaminação gastrointestinal, qual é a afirmativa correta?",
    choices: [
      { text: "Lavagem gástrica tem benefício claro se realizada mais de 6 horas após ingestão na maioria dos tóxicos.", correct: false, explain: "A eficácia da lavagem gástrica reduz-se significativamente após as primeiras 1–2 horas; após esse período o benefício é limitado e os riscos podem superar ganhos." },
      { text: "Carvão ativado é efetivo para álcoois como metanol e etilenoglicol.", correct: false, explain: "Metanol e etilenoglicol não são bem adsorvidos pelo carvão ativado; alternativas específicas (como fomepizol, etanol, ou medidas de suporte/hemodiálise) são necessárias." },
      { text: "Quando indicados, realizar lavagem gástrica primeiro e depois carvão ativado é a sequência recomendada.", correct: true, explain: "Se ambos são apropriados (ingestão recente e sem contraindicações), faz-se primeiro a lavagem para remover volume grosso e depois o carvão ativado para adsorção do remanescente." },
      { text: "Irrigação intestinal com polietilenoglicol é a primeira escolha para intoxicação por paracetamol.", correct: false, explain: "Irrigação intestinal não é tratamento de rotina para paracetamol; o antídoto específico é acetilcisteína. A irrigação tem indicação para certas substâncias não adsorvíveis." }
    ]
  },
  {
    q: "3) Questão — Sobre o uso de carvão ativado na intoxicação, qual item é verdadeiro?",
    choices: [
      { text: "Deve ser administrado por via oral apenas e nunca por sonda nasogástrica.", correct: false, explain: "O carvão pode ser administrado por via oral ou por sonda nasogástrica quando o paciente não consegue engolir; a via depende do estado do paciente e do risco de aspiração." },
      { text: "Dose usual via sonda: 1 g/kg diluído adequadamente; não se aspira o carvão após administração.", correct: true, explain: "A prática comum é 1 g/kg (com teto) diluído em líquido para administração; o carvão não é aspirado de volta, sai nas fezes. Atenção às contraindicações (risco de aspiração, perfuração, corrosivos)." },
      { text: "É eficaz quando a substância ingerida foi ferro ou lítio.", correct: false, explain: "Ferro e lítio não são bem adsorvidos pelo carvão ativado; nesses casos outras medidas (quelantes, diálise, irrigação intestinal) podem ser consideradas conforme o agente." },
      { text: "Carvão ativado em doses múltiplas (a cada 4 horas) é rotina na maioria dos serviços.", correct: false, explain: "Doses múltiplas de carvão têm indicação restrita a certos toxícos e protocolos; não é prática universal para todos os serviços e casos." }
    ]
  },
  {
    q: "4) Questão — Um paciente apresenta sialorreia, miose, broncoespasmo e bradicardia. Qual é a sequência terapêutica correta?",
    choices: [
      { text: "Atropina para manifestações muscarínicas e considerar pralidoxima se organofosforado for suspeito.", correct: true, explain: "Atropina antagoniza receptores muscarínicos e alivia as manifestações muscarínicas; se organofosforado for provável, pralidoxima (reativador de acetilcolinesterase) deve ser considerada." },
      { text: "Naloxone IV de bolus para reverter a síndrome colinérgica.", correct: false, explain: "Naloxone é antídoto para opióides, não tem efeito sobre colinérgicos; portanto não é apropriado nesse cenário." },
      { text: "Flumazenil para antagonizar os efeitos e restabelecer a respiração.", correct: false, explain: "Flumazenil antagoniza benzodiazepínicos; não trata síndrome colinérgica e pode ser perigoso em coingestões convulsivantes." },
      { text: "Diurese alcalina imediata para eliminar o tóxico.", correct: false, explain: "Diurese alcalina é indicada para certas substâncias fracamente ácidas (ex.: salicilatos), não é tratamento primário para síndrome colinérgica." }
    ]
  },
  {
    q: "5) Questão — Sobre intoxicação por opióides, assinale a alternativa correta:",
    choices: [
      { text: "Tríade clássica: midríase, taquipneia e insônia.", correct: false, explain: "A tríade clássica do envenenamento por opióides é miose, depressão respiratória (bradipneia) e rebaixamento do nível de consciência — não midríase nem taquipneia." },
      { text: "Naloxone é antídoto que reverte rapidamente depressão respiratória e rebaixamento de consciência.", correct: true, explain: "Naloxone é antagonista competitivo dos receptores opioides e reverte rapidamente os efeitos centrais e respiratórios, sendo indicado em suspeita de intoxicação opióide com depressão respiratória." },
      { text: "Carvão ativado é contra-indicado em todas as intoxicações por opióides.", correct: false, explain: "Carvão pode ser utilizado se a ingestão foi oral e o paciente não tem risco de aspiração; em pacientes com depressão respiratória grave, a via aérea deve ser protegida antes." },
      { text: "Flumazenil é o tratamento de escolha concomitante para intoxicação por opióides.", correct: false, explain: "Flumazenil antagoniza benzodiazepínicos e não é indicado para intoxicação por opióides a menos que haja suspeita de coingestão e indicação específica." }
    ]
  },
  {
    q: "6) Questão — A respeito do paracetamol (acetaminofeno) e seu manejo na intoxicação aguda, qual alternativa é verdadeira?",

      { text: "A dose hepatotóxica é muito distante da dose terapêutica; apenas ingestas massivas (>20 g) causam risco clínico.", correct: false, explain: "Doses tóxicas podem ser relativamente próximas de doses terapêuticas, principalmente em uso crônico supratherapêutico ou ingestão única elevada; não é necessário chegar a 20 g para risco em todos os casos." },
      { text: "Antídoto específico é a acetilcisteína; protocolo clássico inclui dose de ataque seguida de doses de manutenção.", correct: true, explain: "Acetilcisteína (oral ou IV) restaura reservas de glutationa e evita lesão hepática quando administrada dentro de intervalos adequados; os esquemas padronizados devem ser seguidos conforme peso e via." },
      { text: "Hemodiálise é a primeira linha de tratamento em todas as intoxicações por paracetamol.", correct: false, explain: "Hemodiálise não é tratamento de primeira linha para paracetamol; acetilcisteína é o antídoto principal; diálise pode ser considerada em casos específicos e raros." },
      { text: "Carvão ativado e lavagem gástrica nunca são indicados no paracetamol.", correct: false, explain: "Se a ingestão foi recente e não houver contraindicação, carvão ativado pode ser considerado para reduzir absorção; a decisão depende do tempo e do quadro clínico." }
    ]
  },
  {
    q: "7) Questão — Sobre indicação de hemodiálise em intoxicações, qual alternativa descreve corretamente as indicações clássicas?",

      { text: "Substâncias com alto volume de distribuição e alta ligação proteica são bem removidas por hemodiálise.", correct: false, explain: "Hemodiálise é mais eficaz para toxinas com baixo volume de distribuição e baixa ligação às proteínas plasmáticas; substâncias com alto Vd e alta ligação proteica não são removidas eficientemente." },
      { text: "Lítio e ácido valproico são exemplos de toxícos classicamente indicados para hemodiálise em intoxicações graves.", correct: true, explain: "Lítio e alguns casos de intoxicação por ácido valpróico podem se beneficiar de remoção extracorpórea devido às características farmacocinéticas e gravidade clínica." },
      { text: "Hemodiálise é contra-indicada em intoxicações por metais pesados (por exemplo, ferro) em todas as circunstâncias.", correct: false, explain: "A indicação de remoção extracorpórea em metais depende do agente, da forma e da disponibilidade de quelantes; não é uma contraindicação absoluta em todos os metais." },
      { text: "Hemodiálise não causa instabilidade hemodinâmica e não tem riscos relacionados ao acesso.", correct: false, explain: "Hemodiálise pode provocar instabilidade hemodinâmica e complicações de acesso; por isso risco/benefício devem ser avaliados." }
    ]
  },
  {
    q: "8) Questão — Sobre intoxicações por corrosivos (ácidos e bases), assinale a alternativa correta:",
    choices: [
      { text: "Carvão ativado e lavagem gástrica são rotineiramente indicados.", correct: false, explain: "Para corrosivos, lavagem gástrica e carvão podem agravar as lesões; a conduta é suporte, irrigação de pele/olhos, avaliação endoscópica quando indicada e evitar indução de vômito." },
      { text: "Bases provocam coagulação tecidual e, portanto, lesionam menos que os ácidos.", correct: false, explain: "Ácidos tendem a causar necrose por coagulação, enquanto bases causam necrose por liquefação e frequentemente penetram mais profundamente, causando lesões extensas." },
      { text: "Principal conduta inclui lavagem abundante de pele/olhos, evitar indução de vômito e manejo baseado em suporte e avaliação endoscópica conforme quadro.", correct: true, explain: "Manejo envolve limpeza imediata, suporte clínico, analgesia, evitar procedimentos que possam reexpor tecidos ou provocar aspiração; avaliação endoscópica pode ser necessária para estratificar gravidade." },
      { text: "Ingestão de base forte tipicamente protege contra perfuração esofágica.", correct: false, explain: "Bases fortes frequentemente penetram profundamente e aumentam o risco de perfuração e lesão extensa; não protegem contra perfuração." }
    ]
  },
  {
    q: "9) Questão — Em relação ao uso de flumazenil no contexto de intoxicação por benzodiazepínicos, qual afirmação é verdadeira?",
    choices: [
      { text: "Deve ser usado rotineiramente em todos os pacientes com depressão de consciência por benzodiazepínicos.", correct: false, explain: "Flumazenil tem indicação restrita; seu uso rotineiro é desaconselhado, especialmente se houver risco de convulsões ou coingestão convulsivante." },
      { text: "Dose inicial típica é 0,1 mg, podendo repetir conforme resposta até limites seguros.", correct: true, explain: "O esquema usual inicia com 0,1 mg intravenoso e repete-se gradualmente conforme resposta, com atenção a contraindicações e risco de convulsões." },
      { text: "Flumazenil é seguro em pacientes com história de crise convulsiva e polifarmácia anticonvulsivante.", correct: false, explain: "Em pacientes com epilepsia ou coingestão de substâncias convulsivantes, flumazenil pode precipitar convulsões e deve ser evitado ou usado com extrema cautela." },
      { text: "Flumazenil acelera a eliminação renal dos benzodiazepínicos.", correct: false, explain: "Flumazenil antagoniza farmacodinamicamente os efeitos benzodiazepínicos; não altera a depuração renal das benzodiazepinas." }
    ]
  },
  {
    q: "10) Questão — Sobre síndromes toxicológicas (toxidromes), qual padrão corresponde corretamente à síndrome colinérgica?",
    choices: [
      { text: "A) Midríase, taquicardia, pele seca e hipertermia.", correct: false, explain: "Esses achados são típicos da síndrome anticolinérgica ou simpaticomimética, não colinérgica." },
      { text: "Miose, sialorreia, lacrimejamento, broncoconstrição e aumento de secreções.", correct: true, explain: "A síndrome colinérgica manifesta-se por excesso de atividade muscarínica: miose, sialorreia, lacrimejamento, broncoconstrição e aumento de secreções, típico em organofosforados/carbamatos." },
      { text: "Hipertermia, pele quente e úmida, agitação psicomotora, midríase.", correct: false, explain: "Achados mais compatíveis com síndrome simpaticomimética; colinérgico cursa com secreções aumentadas e miose." },
      { text: "Bradicardia extrema sem alterações pupilares nem secreções.", correct: false, explain: "Bradicardia isolada sem o conjunto de sinais não caracteriza a síndrome colinérgica completa; o diagnóstico baseia-se no conjunto clínico." }
    ]
  },
  {
    q: "11) Questão — Acerca da diurese alcalina como medida de eliminação de tóxicos, marque a alternativa correta:",

  {
    q: "13) Questão — Sobre notificação e suporte especializado, assinale a alternativa correta:",

function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}

const quizEl=document.getElementById('quiz');
let state={answered:0,correct:0};

function render(){
  quizEl.innerHTML='';
  questions.forEach((item,idx)=>{
    const choices=shuffle(item.choices.map((c,i)=>({...c,id:`q${idx}_c${i}`})));
    const wrap=document.createElement('section');
    wrap.className='card';wrap.dataset.qindex=idx;
    wrap.innerHTML=`<div class="qhead"><div class="qnum">Questão ${idx+1}</div></div>
    <div class="question">${item.q}</div>
    <div class="options" id="opts-${idx}"></div>
    <div class="explain" id="exp-${idx}"></div>`;
    const optsEl=wrap.querySelector(`#opts-${idx}`);
    choices.forEach(c=>{
      const lab=document.createElement('label');lab.className='option';
      lab.innerHTML=`<input type="radio" name="q${idx}" data-correct="${c.correct}" data-explain="${c.explain}"><div>${c.text}</div>`;
      optsEl.appendChild(lab);
      lab.querySelector('input').addEventListener('change',(e)=>handleAnswer(idx,e.target));
    });
    quizEl.appendChild(wrap);
  });
  updateStatus();
}

function handleAnswer(idx,inputEl){
  const exp=document.getElementById(`exp-${idx}`);
  const correct=inputEl.dataset.correct==='true';
  const explain=inputEl.dataset.explain;
  exp.style.display='block';
  exp.innerHTML=(correct?'✅ <b>Correto.</b> ':'❌ <b>Incorreto.</b> ')+explain;
  exp.classList.toggle('ok',correct);
  exp.classList.toggle('err',!correct);
  updateProgress();
}

function updateProgress(){
  let a=0,c=0;
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);let any=false,corr=false;
    for(const r of radios){if(r.checked){any=true;if(r.dataset.correct==='true')corr=true;break;}}
    if(any)a++;if(corr)c++;
  });
  state.answered=a;state.correct=c;updateStatus();
}

function updateStatus(){
  document.getElementById('answeredCount').textContent=`Respondidas: ${state.answered} / ${questions.length}`;
  document.getElementById('progressCorrect').textContent=`Corretas: ${state.correct}`;
}

document.getElementById('showAll').addEventListener('click',()=>{
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);
    const exp=document.getElementById(`exp-${idx}`);let any=false;
    for(const r of radios){
      if(r.checked){any=true;const corr=r.dataset.correct==='true';
        exp.style.display='block';
        exp.innerHTML=(corr?'✅ <b>Correto.</b> ':'❌ <b>Incorreto.</b> ')+r.dataset.explain;
        exp.classList.toggle('ok',corr);exp.classList.toggle('err',!corr);
        break;}
    }
    if(!any){exp.style.display='block';exp.innerHTML='<em>Nenhuma alternativa selecionada.</em>';exp.classList.remove('ok','err');}
  });
  updateProgress();
});

document.getElementById('reset').addEventListener('click',()=>{
  questions.forEach((_,idx)=>{
    const radios=document.getElementsByName(`q${idx}`);
    for(const r of radios)r.checked=false;
    const exp=document.getElementById(`exp-${idx}`);
    exp.style.display='none';exp.innerHTML='';exp.classList.remove('ok','err');
  });
  state={answered:0,correct:0};updateStatus();
});

render();
</script>
